name: Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support-local
          POSTGRES_DB: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://support:support-local@localhost:5432/support
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - name: Smoke test the Docker Compose deployment
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ | grep 'Customer Support Desk'
      - name: Show container logs
        if: failure()
        run: docker compose logs
