services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://support:support-local@db:5432/support
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8000:8000"
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - support-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  support-data:
